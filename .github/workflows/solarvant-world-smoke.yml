name: Solarvant in-world native renderer verification
on:
  push:
    branches: [solarvant-mc1.21.1-build]
    paths:
      - .github/workflows/solarvant-world-smoke.yml
      - 'Solarvant/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-world:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {loader: fabric, chunks: 8}
          - {loader: fabric, chunks: 32}
          - {loader: neoforge, chunks: 32}
          - {loader: forge, chunks: 32}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Install software OpenGL and UI test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool imagemagick libgl1-mesa-dri
      - name: Generate a world with native GPU residency enabled
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          DISPLAY: ':99'
          LOADER: ${{ matrix.loader }}
          CHUNKS: ${{ matrix.chunks }}
        run: |
          set -euo pipefail
          WORK_DIR="Solarvant/$LOADER/run"
          mkdir -p "$WORK_DIR/config" screenshots
          cat > "$WORK_DIR/config/solarvant.properties" <<'EOF'
          engineEnabled=true
          nativeRendererEnabled=true
          fastOpaqueFaces=true
          cacheSectionTints=true
          hudVisible=true
          compactHud=true
          EOF
          printf 'onboardAccessibility:false\nrenderDistance:%s\nsimulationDistance:12\n' "$CHUNKS" > "$WORK_DIR/options.txt"
          Xvfb :99 -screen 0 1280x720x24 -nolisten tcp >xvfb.log 2>&1 &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 3
          (cd "Solarvant/$LOADER" && timeout 500 gradle runClient --no-daemon --console=plain) > client.log 2>&1 &
          CLIENT_PID=$!
          for attempt in $(seq 1 100); do
            if xdotool search --onlyvisible --name 'Minecraft' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          sleep 15
          WIN=$(xdotool search --onlyvisible --name 'Minecraft' | head -n 1 || true)
          if [ -z "$WIN" ]; then echo "Minecraft window not found"; exit 1; fi
          xdotool windowsize "$WIN" 1280 720
          xdotool windowmove "$WIN" 0 0
          xdotool windowactivate --sync "$WIN" || true
          sleep 5
          import -window root screenshots/main-menu.png
          xdotool mousemove 640 330 click 1
          sleep 10
          import -window root screenshots/world-list.png
          xdotool mousemove 400 670 click 1
          sleep 10
          import -window root screenshots/world-create.png
          xdotool mousemove 400 670 click 1
          sleep 140
          import -window root screenshots/world-render.png
          echo "World files:"
          find "$WORK_DIR/saves" -maxdepth 2 -name level.dat -print || true
          grep -E 'Preparing spawn|Loaded [0-9]+ advancements|Native resident terrain mesh uploaded' client.log | tail -20 || true
          if ! find "$WORK_DIR/saves" -maxdepth 2 -name level.dat -print | grep -q level.dat; then
            echo "World creation failed"
            exit 1
          fi
          if grep -Eqi 'MixinApplyError|MixinTransformerError|InvalidMixinException|InjectionError|Failed to load mod|Exception in thread|NoSuchMethodError|Reported exception|Rendering screen|Rendering level|Cannot read field|java.lang.NullPointerException|Crash report saved|Stopping singleplayer server' client.log; then
            echo "Detected client render error or unplanned shutdown"
            grep -Ei 'Exception|Crash|Stopping singleplayer|MixinApplyError' client.log | tail -50 || true
            exit 1
          fi
          if ! grep -q 'Native resident terrain mesh uploaded:' client.log; then
            echo "Native backend was not exercised; reject false-positive smoke"
            exit 1
          fi
          # A completely blank framebuffer does not constitute visual evidence.
          MEAN=$(identify -format '%[fx:mean]' screenshots/world-render.png)
          python3 - "$MEAN" <<'PYTEST'
          import sys
          value = float(sys.argv[1])
          assert 0.02 < value < 0.98, f"Blank or overexposed framebuffer ({value})"
          PYTEST
          echo "PASS: generated world, native GPU allocations and non-empty frame without reported crash"
          kill "$CLIENT_PID" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solarvant-native-world-${{ matrix.loader }}-${{ matrix.chunks }}chunks
          path: |
            screenshots/*.png
            client.log
            xvfb.log
          retention-days: 14
          if-no-files-found: error