name: Build Solarvant 1.21.1
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile and package ${{ matrix.loader }}
        working-directory: ${{ matrix.loader }}
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: solarvant-${{ matrix.loader }}-mc1.21.1
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error
  pure-java-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run deterministic core checks
        run: bash scripts/test-core.sh
