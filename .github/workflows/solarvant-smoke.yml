name: Solarvant client startup smoke
on:
  push:
    branches: [solarvant-mc1.21.1-build]
    paths: [.github/workflows/solarvant-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, neoforge, forge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Extract source
        run: base64 -d solarvant-build/sources.tar.xz.b64 | tar -xJ
      - name: Stage the actual production Forge JAR for client integration testing
        if: matrix.loader == 'forge'
        shell: bash
        run: |
          (cd forge && gradle build --no-daemon --console=plain)
          mkdir -p forge/run/mods
          find forge/build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -exec cp '{}' forge/run/mods/ ';'
      - name: Launch Minecraft for startup verification
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e
          cd "${{ matrix.loader }}"
          timeout 180 xvfb-run -a gradle runClient --no-daemon --console=plain >../smoke.log 2>&1
          code=$?
          set -e
          tail -n 60 ../smoke.log
          if grep -Eqi 'MixinApplyError|MixinTransformerError|InvalidMixinException|InjectionError|Failed to load mod|FATAL|Exception in thread|NoSuchMethodError' ../smoke.log; then exit 1; fi
          if [ "$code" != 0 ] && [ "$code" != 124 ]; then exit 1; fi
          grep -Eiq 'Setting user|Backend library|OpenGL|LWJGL|Render thread' ../smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solarvant-startup-${{ matrix.loader }}
          path: smoke.log
          retention-days: 7
