plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}
version = project.mod_version
group = 'dev.solarvant'
base { archivesName = 'solarvant-forge-1.21.1' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21) }
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

// Forge's development mod scanner expects the @Mod entry point and mods.toml
// in the same module root. Keep resources alongside compiled classes for runs.
sourceSets.main.output.resourcesDir = layout.buildDirectory.dir('classes/java/main').get().asFile

minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods {
                solarvant { source sourceSets.main }
            }
        }
    }
}
repositories { mavenCentral() }
dependencies {
    minecraft "net.minecraftforge:forge:1.21.1-${project.forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
mixin {
    add sourceSets.main, 'solarvant.refmap.json'
    config 'solarvant.forge.mixins.json'
}

jar {
    manifest.attributes([
        'Specification-Title': 'Solarvant',
        'Specification-Vendor': 'Solarvant',
        'Specification-Version': '1',
        'Implementation-Title': 'Solarvant',
        'Implementation-Version': project.version,
        'MixinConfigs': 'solarvant.forge.mixins.json'
    ])
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }

reobf { create('jar') }
